name: Verify the deployed workspace sample
on:
  push:
    branches: [deploy/scriptagent-web-check]
    paths: ['.github/workflows/sample-workspace.yml']
permissions:
  contents: write
jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -q -r requirements.txt
      - name: Prepare and analyze the fictional two-scene script
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: python
        run: |
          from pathlib import Path
          import shutil
          from script_agent.pipeline import prepare_script, analyze_quick_preview, AnalysisConfig
          source = Path("/tmp/末班渡船.txt")
          source.write_text("INT. 售票亭 - 夜\n林遥把最后一张船票递给舟舟。\n林遥：你先走，我答应过你妈妈。\n舟舟：那你呢？\n\nEXT. 码头 - 黎明\n舟舟跑回岸上，把船票撕成两半。\n舟舟：一起等下一班。\n林遥拿起对讲机，告诉船长还有两个人。", encoding="utf-8")
          run = Path("/tmp/sample-run")
          manifest = prepare_script(source, run)
          assert manifest["scene_count"] == 2
          analyze_quick_preview(run, AnalysisConfig(extract_model="gpt-6-luna", synthesis_model="gpt-6-luna", max_workers=1, max_output_tokens=3000, fast_mode=True))
          output = Path("deploy-sample")
          for name in ["manifest.json", "source/scenes.json", "source/source.txt", "output/report.json", "output/report.md", "output/report.html", "output/relationship-graph.json", "output/knowledge-ledger.json", "output/review-queue.json"]:
              if (run / name).is_file():
                  (output / name).parent.mkdir(parents=True, exist_ok=True)
                  shutil.copyfile(run / name, output / name)
          assert (output / "output/report.json").is_file()
      - name: Preserve the synthetic sample
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deploy-sample
          git commit -m 'Save the verified fictional workspace sample'
          gh auth setup-git
          git push origin HEAD
